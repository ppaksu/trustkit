<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#606b78"/>
    </marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a5220"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c5b70"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#ffffff"/>

  <text x="32" y="38" font-size="17" font-weight="700" fill="#161a20">NegLog · 컴포넌트와 신뢰 경계</text>
  <text x="32" y="60" font-size="12.5" fill="#606b78">검증자에게서 게이트웨이와 로그로 향하는 화살표가 없다</text>

  <!-- trust boundary -->
  <rect x="232" y="104" width="404" height="128" rx="10" fill="none" stroke="#8f3520" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="434" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#8f3520">검증자가 신뢰하지 않는 영역</text>

  <!-- 요청자 -->
  <rect x="34" y="132" width="140" height="72" rx="7" fill="#f4f6f8" stroke="#c9d0d8" stroke-width="1.4"/>
  <text x="104" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#161a20">요청자</text>
  <text x="104" y="182" text-anchor="middle" font-size="11.5" fill="#606b78">의도 서명 · 번들 보관</text>

  <!-- 게이트웨이 -->
  <rect x="256" y="132" width="152" height="72" rx="7" fill="#f4f6f8" stroke="#c9d0d8" stroke-width="1.4"/>
  <text x="332" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#161a20">게이트웨이</text>
  <text x="332" y="182" text-anchor="middle" font-size="11.5" fill="#606b78">정책 평가 · 판단 서명</text>

  <!-- 로그 -->
  <rect x="462" y="132" width="152" height="72" rx="7" fill="#f4f6f8" stroke="#c9d0d8" stroke-width="1.4"/>
  <text x="538" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#161a20">로그</text>
  <text x="538" y="182" text-anchor="middle" font-size="11.5" fill="#606b78">append-only · 접수 서명</text>

  <!-- 체인 -->
  <rect x="706" y="132" width="160" height="72" rx="7" fill="#e4eff3" stroke="#1c5b70" stroke-width="1.8"/>
  <text x="786" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#1c5b70">체인 · 공개 RPC</text>
  <text x="786" y="182" text-anchor="middle" font-size="11.5" fill="#1c5b70">앵커 루트 · 블록 상태</text>

  <!-- 요청자 → 게이트웨이 -->
  <line x1="174" y1="154" x2="250" y2="154" stroke="#9a5220" stroke-width="1.8" marker-end="url(#as)"/>
  <text x="212" y="146" text-anchor="middle" font-size="11" fill="#9a5220">요청 의도 서명</text>

  <!-- 게이트웨이 → 요청자 -->
  <line x1="250" y1="186" x2="180" y2="186" stroke="#9a5220" stroke-width="1.8" marker-end="url(#as)"/>
  <text x="214" y="202" text-anchor="middle" font-size="11" fill="#9a5220">거절 번들</text>

  <!-- 게이트웨이 → 로그 -->
  <line x1="408" y1="154" x2="456" y2="154" stroke="#9a5220" stroke-width="1.8" marker-end="url(#as)"/>
  <text x="432" y="146" text-anchor="middle" font-size="11" fill="#9a5220">제출</text>

  <!-- 로그 → 게이트웨이 -->
  <line x1="456" y1="186" x2="414" y2="186" stroke="#9a5220" stroke-width="1.8" marker-end="url(#as)"/>
  <text x="435" y="202" text-anchor="middle" font-size="11" fill="#9a5220">LogAck</text>

  <!-- 로그 → 체인 -->
  <line x1="614" y1="156" x2="700" y2="156" stroke="#1c5b70" stroke-width="1.8" marker-end="url(#ac)"/>
  <text x="657" y="148" text-anchor="middle" font-size="11" fill="#1c5b70">submitRoot</text>

  <!-- 게이트웨이 → 체인 (eth_getProof) -->
  <path d="M332,204 L332,262 L786,262 L786,210" fill="none" stroke="#1c5b70" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ac)"/>
  <text x="560" y="256" text-anchor="middle" font-size="11" fill="#1c5b70">eth_getProof · 판단 시점 상태 증거 수집</text>

  <!-- 검증기 -->
  <rect x="322" y="336" width="224" height="66" rx="7" fill="#ffffff" stroke="#276749" stroke-width="1.9"/>
  <text x="434" y="364" text-anchor="middle" font-size="14" font-weight="600" fill="#276749">독립 검증기</text>
  <text x="434" y="384" text-anchor="middle" font-size="11.5" fill="#606b78">번들 + 공개 RPC 만</text>

  <!-- 요청자 → 검증기 -->
  <path d="M104,204 L104,369 L316,369" fill="none" stroke="#606b78" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="200" y="362" text-anchor="middle" font-size="11" fill="#606b78">번들 전달</text>

  <!-- 검증기 → 체인 -->
  <path d="M546,369 L786,369 L786,212" fill="none" stroke="#1c5b70" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ac)"/>
  <text x="668" y="362" text-anchor="middle" font-size="11" fill="#1c5b70">앵커 루트 조회 · 블록 해시 확인</text>

  <!-- legend -->
  <g font-size="11.5" fill="#606b78">
    <rect x="34" y="414" width="11" height="11" rx="2" fill="#9a5220"/>
    <text x="52" y="424">서명이 발생하는 지점</text>
    <rect x="196" y="414" width="11" height="11" rx="2" fill="#1c5b70"/>
    <text x="214" y="424">체인이 관여하는 경로</text>
    <rect x="358" y="414" width="11" height="11" rx="2" fill="#8f3520"/>
    <text x="376" y="424">신뢰하지 않는 영역</text>
  </g>
</svg>
