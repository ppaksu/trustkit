<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>

  <text x="32" y="38" font-size="17" font-weight="700" fill="#161a20">검증기가 판정하는 것</text>
  <text x="32" y="60" font-size="12.5" fill="#606b78">번들 하나와 공개 RPC 하나로 최종 판정이 난다. 도전 기간도 담보도 없다</text>

  <rect x="32" y="86" width="836" height="98" rx="8" fill="#e4eff3" stroke="#1c5b70" stroke-width="1.8"/>
  <circle cx="72" cy="118" r="15" fill="#1c5b70"/>
  <text x="72" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A</text>
  <text x="102" y="114" font-size="15" font-weight="700" fill="#161a20">기록의 진위와 무결성</text>
  <text x="102" y="136" font-size="12.5" fill="#3a434e">세 서명 복원 · 앵커된 루트에 대한 포함 증명 · 두 앵커 사이 일관성 증명</text>
  <text x="102" y="158" font-size="11.5" fill="#606b78">번들만 있으면 항상 수행. 검증 1~9 단계</text>
  <rect x="700" y="100" width="148" height="28" rx="5" fill="#ffffff" stroke="#1c5b70"/>
  <text x="774" y="119" text-anchor="middle" font-size="11.5" fill="#1c5b70">항상 판정</text>

  <rect x="32" y="196" width="836" height="98" rx="8" fill="#f6ece3" stroke="#9a5220" stroke-width="1.6"/>
  <circle cx="72" cy="228" r="15" fill="#9a5220"/>
  <text x="72" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">B</text>
  <text x="102" y="224" font-size="15" font-weight="700" fill="#161a20">정적 사유의 참거짓</text>
  <text x="102" y="246" font-size="12.5" fill="#3a434e">커밋된 목록에 대한 포함·비포함 증명 · 커밋된 한도와의 수치 비교</text>
  <text x="102" y="268" font-size="11.5" fill="#606b78">해당 필드를 공개했을 때 수행. 검증 10 단계</text>
  <rect x="700" y="210" width="148" height="28" rx="5" fill="#ffffff" stroke="#9a5220"/>
  <text x="774" y="229" text-anchor="middle" font-size="11.5" fill="#9a5220">공개 시 판정</text>

  <rect x="32" y="306" width="836" height="104" rx="8" fill="#f6ece3" stroke="#9a5220" stroke-width="1.6"/>
  <circle cx="72" cy="338" r="15" fill="#9a5220"/>
  <text x="72" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">C</text>
  <text x="102" y="334" font-size="15" font-weight="700" fill="#161a20">동적 사유의 참거짓</text>
  <text x="102" y="356" font-size="12.5" fill="#3a434e">EIP-1186 상태 증거를 판단 시점 stateRoot 에 대해 검증</text>
  <text x="102" y="378" font-size="11.5" fill="#606b78">해당 필드를 공개했을 때 수행. 검증 11 단계. EVM 재실행 없음</text>
  <text x="102" y="396" font-size="11.5" fill="#606b78">증거가 루트에 자기 인증되므로 게이트웨이가 만들어 넣어도 위조 불가</text>
  <rect x="700" y="320" width="148" height="28" rx="5" fill="#ffffff" stroke="#9a5220"/>
  <text x="774" y="339" text-anchor="middle" font-size="11.5" fill="#9a5220">공개 시 판정</text>

  <rect x="32" y="422" width="836" height="34" rx="6" fill="#f4f6f8" stroke="#c9d0d8"/>
  <text x="48" y="444" font-size="12.5" fill="#3a434e">사유가 외부 데이터 의존이거나 재량이면 <tspan font-weight="700" fill="#8f3520">판정 불가</tspan> 로 보고한다. 거짓과 구분된다</text>
</svg>
